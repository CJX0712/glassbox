name: selftest

# The invariant suite is this project's quality gate.  Every check in it is a
# property that must hold *by construction*, and collectively they cover the
# things that rot silently otherwise: chunking coverage, unit-norm embeddings,
# FAISS/numpy agreement, BM25's closed form, RRF arithmetic, retrieval
# determinism, and the reranker's role as a signal rather than a veto.
#
# It is cheap — single-digit seconds once the checkpoints are cached — so there
# is no reason for it not to run on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform: one failing OS must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
        include:
          # Floor of the supported range in pyproject.toml (requires-python >= 3.10).
          - os: ubuntu-latest
            python: "3.10"

    env:
      # GitHub runners sit outside China and reach huggingface.co directly;
      # config.py defaults to hf-mirror.com for the development host.
      HF_ENDPOINT: https://huggingface.co
      # Keep both the embedder and the cross-encoder under one cacheable root.
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      # Without this a failed reranker download would produce a *green* run
      # that silently skipped the whole rerank group — the suite would shrink
      # instead of failing.  See selftest.run_all.
      GLASSBOX_REQUIRE_RERANK: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Cache embedding and reranker checkpoints
        uses: actions/cache@v6
        with:
          path: ${{ env.HF_HOME }}
          key: hf-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-${{ runner.os }}-py${{ matrix.python }}-
            hf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show resolved models
        run: python -m glassbox models

      - name: Run invariant suite
        shell: bash
        run: |
          set -o pipefail
          python -m glassbox selftest 2>&1 | tee "selftest-report-${{ runner.os }}.txt"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-${{ runner.os }}-py${{ matrix.python }}
          path: selftest-report-${{ runner.os }}.txt
          if-no-files-found: warn
          retention-days: 14
